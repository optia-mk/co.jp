<section class="py-16 bg-gray-50 text-gray-800" id="contact">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
      
      <!-- ヘッダー -->
      <span class="text-xs font-semibold tracking-widest text-indigo-600 uppercase">CONTACT</span>
      <h2 class="text-2xl sm:text-3xl font-bold mt-2 text-gray-900">無料相談・お問い合わせ</h2>
      <p class="mt-3 text-sm text-gray-600">
        お問い合わせ・ご相談は下記の専用メールアドレスへ直接ご連絡ください。
      </p>

      <!-- メールアドレス表示カード -->
      <div class="mt-8 p-6 bg-indigo-50/50 rounded-xl border border-indigo-100">
        <span class="text-xs font-bold text-indigo-600 tracking-wider">公式メールアドレス</span>
        <div class="mt-2 text-2xl sm:text-3xl font-extrabold text-indigo-950 tracking-wide font-mono">
          optia@outlook.jp
        </div>

        <!-- アクションボタン -->
        <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
          <!-- 1. メールソフト起動ボタン -->
          <a
            href="mailto:optia@outlook.jp"
            class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors duration-200"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            メールソフトを起動して送信
          </a>

          <!-- 2. アドレスコピーボタン -->
          <button
            type="button"
            onclick="copyEmailAddress(this)"
            class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-medium rounded-lg shadow-sm transition-colors duration-200"
          >
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>アドレスをコピー</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- コピー処理JavaScript -->
<script>
  function copyEmailAddress(button) {
    const email = 'optia@outlook.jp';
    navigator.clipboard.writeText(email).then(() => {
      const originalText = button.innerHTML;
      button.innerHTML = `
        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span class="text-green-600 font-semibold">コピーしました！</span>
      `;
      setTimeout(() => {
        button.innerHTML = originalText;
      }, 2000);
    });
  }
</script>
